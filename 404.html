<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JarvQuant</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0d18" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0d18;
           color: rgba(245,247,255,.9); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .box { text-align: center; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: rgba(245,247,255,.55); font-size: 14px; margin: 0 0 22px; }
    a { color: #fff; background: linear-gradient(90deg, #6D28D9, #7C3AED); padding: 12px 22px; border-radius: 8px;
        text-decoration: none; font-weight: 700; font-size: 14px; }
  </style>
  <script>
    // Partner links: jarvquant.com/r/<code>. GitHub Pages serves this page for
    // any unknown path, so the link needs no page of its own. The visit is
    // recorded server-side (hashed IP, 30 days); nothing is stored on the
    // visitor's device, the partner only travels on in the URL (?ref=partner-…),
    // where ref.js picks it up for the "e-mail me the link" form.
    (function () {
      var m = location.pathname.match(/^\/r\/([A-Za-z0-9_-]{3,20})\/?$/);
      if (!m) return;
      var code = m[1].toLowerCase();
      var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
        ? "http://localhost:8765" : "https://jarvquant-api.onrender.com";
      document.documentElement.style.visibility = "hidden";
      var go = function () { location.replace("/?ref=partner-" + code); };
      try {
        fetch(API + "/partner/click", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code }), keepalive: true
        }).then(go, go);
        setTimeout(go, 1500); // never strand the visitor on a slow API
      } catch (e) { go(); }
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>This page doesn't exist (anymore).</p>
    <a href="/">Go to jarvquant.com</a>
  </div>
</body>
</html>
